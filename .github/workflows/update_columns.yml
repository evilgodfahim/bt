name: Update RSS Feeds

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r requirements.txt

      - name: Start Redis
        run: |
          docker network create trawl-net
          docker run -d \
            --name redis \
            --network trawl-net \
            redis:alpine

      - name: Start Trawl
        run: |
          docker run -d \
            --name trawl \
            --network trawl-net \
            -p 8191:8191 \
            -e REDIS_URL=redis://redis:6379 \
            -e BROWSER_POOL_SIZE=2 \
            -e RESIDENTIAL_PROXY_URL=${{ secrets.WEBSHARE_PROXY_URL }} \
            ghcr.io/germondai/trawl:latest

      - name: Wait for Trawl
        run: |
          for i in $(seq 1 40); do
            curl -sf http://localhost:8191/health && echo 'Trawl ready' && exit 0
            sleep 2
          done
          docker logs trawl && exit 1
      - name: Wait for FlareSolverr
        run: |
          echo "Waiting for FlareSolverr..."
          for i in {1..20}; do
            if curl -s http://localhost:8191/v1 > /dev/null; then
              echo "FlareSolverr is ready"
              exit 0
            fi
            echo "Still starting... ($i)"
            sleep 3
          done
          echo "FlareSolverr did not start. Dumping logs:"
          docker logs flaresolverr
          exit 1

      - name: Run fetch script
        run: |
          python rss_fetcher.py

      - name: Commit & push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if [ -n "$(git status --porcelain)" ]; then
            git add columns.xml banglatribune.xml
            git commit -m "Update RSS feeds [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi